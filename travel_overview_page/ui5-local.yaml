# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: sap.fe.demo.traveloverview1
type: application
framework:
  name: SAPUI5
  version: 1.136.8
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ushell
    - name: sap.f
    - name: sap.ui.comp
    - name: sap.ui.generic.app
    - name: sap.suite.ui.generic.template
    - name: sap.ovp
    - name: sap.ui.rta
    - name: sap.ui.layout
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
      configuration:
        debug: true
        transformModulesToUI5:
          overridesToOverride: true
        excludePatterns:
          - /Component-preload.js
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
        backend:
          - authenticationType: reentranceTicket # SAML support for vscode
            path: /sap
            url: https://e9391a43-4140-4b13-bac2-b1734a404edf.abap.eu10.hana.ondemand.com
            destination: abap-cloud-abap_instance-zeppelin-gmbh_zeppelin-gnbh-0mm2uycj-sandbox
          - path: /sap/opu/odata4/sap/zui_rap_atravel_2_o4/srvd/sap/zui_rap_atravel_2_o4/0001/
            url: https://e9391a43-4140-4b13-bac2-b1734a404edf.abap.eu10.hana.ondemand.com/
            authenticationType: OAuth2UserTokenExchange
            destination: abap-cloud-abap_instance-zeppelin-gmbh_zeppelin-gnbh-0mm2uycj-sandbox
    - name: sap-fe-mockserver
      beforeMiddleware: csp
      configuration:
        mountPath: /
        services:
          - urlPath: /sap/opu/odata/sap/ZUI_RAP_ATRAVEL_2_ANALY_O4
            metadataPath: ./webapp/localService/mainService/metadata.xml
            mockdataPath: ./webapp/localService/mainService/data
            generateMockData: true
          - urlPath: /sap/opu/odata4/sap/zui_rap_atravel_2_o4/srvd/sap/zui_rap_atravel_2_o4/0001
            metadataPath: ./webapp/localService/zui_rap_atravel_2_o4/metadata.xml
            mockdataPath: ./webapp/localService/zui_rap_atravel_2_o4/data
            generateMockData: true
        annotations:
          - localPath: ./webapp/localService/mainService/ZUI_RAP_ATRAVEL_2_ANALY_O4_VAN.xml
            urlPath: /sap/opu/odata/IWFND/CATALOGSERVICE;v=2/Annotations(TechnicalName='ZUI_RAP_ATRAVEL_2_ANALY_O4_VAN',Version='0001')/$value/
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        debug: true
        transformModulesToUI5:
          overridesToOverride: true
